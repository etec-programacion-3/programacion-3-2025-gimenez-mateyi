version: '3.8'

services:

  mongodb:
    image: mongo:7.0
    container_name: gimenez-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: concesionaria
    volumes:
      - mongodb_data:/data/db
      - ./BACKEND/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - gimenez-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/concesionaria --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./BACKEND
    container_name: gimenez-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URL: mongodb://admin:admin123@mongodb:27017/concesionaria?authSource=admin
      JWT_SECRET: Colon1339
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gimenez-network

  frontend:
    build:
      context: ./FRONTEND
    container_name: gimenez-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - gimenez-network

volumes:
  mongodb_data:
    driver: local

networks:
  gimenez-network:
    driver: bridge